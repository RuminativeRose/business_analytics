[build-system]
requires = ["setuptools","uv","ruff"]

[project]
name = "Business Analytics"
version = "0.1.0"
authors = [
  { name="Rose Nestor", email="rose.nestor@gmail.com" },
]
description = "An LLM-Assisted Business Analytics/Finance Tool"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/RuminativeRose/business_analytics"
Issues = "https://github.com/RuminativeRose/business_analytics/issues"

[pytest]
addopts = ["--import-mode=importlib"]